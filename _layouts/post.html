<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    {% assign pdf_url = page.pdf | relative_url %}
    <title>{{ page.title | escape }}</title>
    <link rel="canonical" href="{{ page.pdf | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ pdf_url | escape }}">
    <script>window.location.replace({{ pdf_url | jsonify }});</script>
  </head>
  <body></body>
</html>
